# Manifest of the sample guide: the smallest useful one. Format: docs/connect-your-guide.md
schema = 1

[guide]
name = "Self-hosted notes server"
description = "running Quillnote, a notes server, and Larkdb, its database, on a machine of your own"
# no repository: local only (no issue, no pull request)

[content]
language = "en"
exclude = ["README.md"]
modified_field = "last_modified"

[watch]
source = "file"
path = "watch.json"
feeds = "feeds.json"    # what `vault-watch collect` reads; source = "feeds" to analyse its watches
floors = "floors.json"  # advisories already fixed at these versions are dropped
