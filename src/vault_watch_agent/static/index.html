<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vault-watch</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/boot.js"></script>   <!-- before the first paint: mode, palette, size of the text -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="#/"><img src="/static/icon.svg" alt="" width="22" height="22">vault-watch</a>
    <details class="menu" id="guide-menu">   <!-- the guide this server works on: its site, its repository, its chapters (app.js header) -->
      <summary><span class="guide-name" id="guide-name"></span></summary>
      <div class="menu-items" id="guide-links"></div>
    </details>
    <nav>
      <a href="#/" data-nav="watches">Veilles</a>
      <a href="#/sources" data-nav="sources">Sources</a>
      <a href="#/check" data-nav="check">Vérifier le guide</a>
      <a href="#/report" data-nav="report">Signaler une erreur</a>
      <a href="#/costs" data-nav="costs">Coûts</a>
    </nav>
    <div class="header-end">   <!-- at the right; on a narrow window it goes under the menu, still at the right -->
      <div class="tools" id="tools"></div>   <!-- size, mode, palettes, bell, language, Settings: app.js header() -->
    </div>
  </header>
  <main id="page" aria-live="polite"></main>
  <footer id="footer"></footer>   <!-- the version, the agent's code, « Give my opinion » (app.js header) -->
  <script src="/static/themes.js"></script>
  <script src="/static/notify.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
