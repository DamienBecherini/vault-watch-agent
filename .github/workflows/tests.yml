name: tests

# The suite on both systems: the agent runs claude, git, gh and node as subprocesses, and paths differ.
# No secret and no model call: the tests use a fake model.
on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity (the tests commit in throwaway repositories)
        run: |
          git config --global user.name "tests"
          git config --global user.email "tests@example.invalid"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    # The rules of pyproject.toml ([tool.ruff]), once: they do not depend on the system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.14"
      - run: python -m ruff check src tests
