name: tests

# The suite on both systems: the agent runs claude, git, gh and node as subprocesses, and paths differ.
# No secret and no model call: the tests use a fake model.
on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity (the tests commit in throwaway repositories)
        run: |
          git config --global user.name "tests"
          git config --global user.email "tests@example.invalid"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    # The rules and the types of pyproject.toml ([tool.ruff], [tool.pyright]), once: they do not depend on the system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,pdf]"  # pdf: pypdf, imported by links.py
      - run: python -m ruff check src tests
      - run: python -m pyright

  page:
    # The page's scripts (ES modules, // @ts-check) checked by TypeScript, as jsconfig.json says; nothing is built
    # (the runner's own Node, as for the node tests of the suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx -y -p typescript@5.9 tsc -p jsconfig.json --noEmit
