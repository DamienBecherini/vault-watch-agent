name: sample watch

# The reusable workflow (collect.yml) on the sample guide, by hand: it collects the sample's feeds with the agent of
# this very commit and keeps the watch as an artifact. No issue is opened in this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    uses: ./.github/workflows/collect.yml
    with:
      guide: examples/sample-guide
      days: 30
      open_issue: false
      agent_ref: ${{ github.sha }}
