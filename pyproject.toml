[project]
name = "vault-watch-agent"
dynamic = ["version"]
description = "Keep a Markdown guide up to date with what changes in its field: a LangGraph agent proposes sourced corrections, a human reviews them, it opens the pull request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anthropic>=2.6",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "pydantic>=2.14",
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "httpx>=0.28",  # the OpenAI-compatible engine and the web tools (already a dependency of anthropic)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "websockets>=13"]  # websockets: the page drawn in a headless Chrome (test_page_smoke)
pdf = ["pypdf>=6.1"]  # the check « links » reads the text of a PDF (links.py)

[project.scripts]
vault-watch = "vault_watch_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vault_watch_agent.__version__" }

[tool.setuptools.package-data]
vault_watch_agent = ["static/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
