[project]
name = "vault-watch-agent"
version = "0.1.0"
description = "LangGraph agent that turns the weekly ecosystem watch of the IA on-prem vault into reviewed, sourced edits and a pull request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anthropic>=2.6",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "pydantic>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vault-watch = "vault_watch_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
