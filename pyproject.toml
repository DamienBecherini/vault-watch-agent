[project]
name = "vault-watch-agent"
dynamic = ["version"]
description = "Keep a Markdown guide up to date with what changes in its field: a LangGraph agent proposes sourced corrections, a human reviews them, it opens the pull request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anthropic>=2.6",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "pydantic>=2.14",
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "httpx>=0.28",  # the OpenAI-compatible engine and the web tools (already a dependency of anthropic)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "websockets>=13", "ruff>=0.14", "pyright>=1.1.400"]  # websockets: the page drawn in a headless Chrome (test_page_smoke)
pdf = ["pypdf>=6.1"]  # the check « links » reads the text of a PDF (links.py)
e2e = ["playwright>=1.50", "uvicorn>=0.30"]  # tests/test_e2e.py, run with pytest -m e2e: the editor's journeys clicked in Chrome

[project.scripts]
vault-watch = "vault_watch_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vault_watch_agent.__version__" }

[tool.setuptools.package-data]
vault_watch_agent = ["static/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The journeys clicked in a browser (tests/test_e2e.py) run only when asked: pytest -m e2e
markers = ["e2e: a journey of the editor clicked in a real browser (Playwright); run with pytest -m e2e"]
addopts = "-m 'not e2e'"

# ruff check src tests: the rules the code keeps (1.6.0); long lines up to 160 (the prose of the docstrings and
# of the prompts is wrapped at 120, a line of code may run longer)
[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E731: a short lambda named is the house style; B905: zip() of lists of the same length by construction;
# SIM105: try/except/pass reads plainer than contextlib.suppress here
ignore = ["E731", "B905", "SIM105"]

# pyright: the types the code says, checked in CI (1.6.0). A run's state is a TypedDict read with state["key"] where
# the graph guarantees the key: not reported.
[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportTypedDictNotRequiredAccess = false
